      - label: proxy-voting-procedures-and-principles
        url: "https://www.capitalgroup.com/retirement/participant/pdf/shareholder/AFDLIT-007-556841.pdf"
        adviser: "Capital Research and Management Company (CRMC) and affiliated Advisers"
        adviser_key: "CRMC"

