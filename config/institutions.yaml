      - "Before 2026-01-12 one Vanguard Group policy governed all internally managed funds; Vanguard Portfolio Management Investment Stewardship (VPMIS) and Vanguard Capital Management Investment Stewardship (VCMIS) both launched on 2026-01-12 (VPMIS 2026 annual report, https://corporate.vanguard.com/content/dam/corp/about-our-funds/pdf/vpm/vpmis_2026_annual_report.pdf)."
      - "Series-to-team mapping comes from Vanguard's two funds lists dated 2026-01-12 (https://corporate.vanguard.com/content/dam/corp/about-our-funds/pdf/vpm/vpm-funds.pdf and https://corporate.vanguard.com/content/dam/corp/about-our-funds/pdf/vcm/vcm-funds.pdf); lists published later could differ, and the date key compares the meeting date, not the date the vote was cast."
      - "The archive holds one pre-split Vanguard policy capture (Wayback 2022-01-17); the editions in force between 2022 and 2026-01-11 are not archived, so votes in that window are compared against the 2022 text."
      - "Vanguard Explorer Value Fund (S000028087) is kept apart as EXTERNAL: Vanguard's N-CSR names Ariel Investments, Frontier Capital Management and Wellington Management as its advisers (https://www.sec.gov/Archives/edgar/data/1021882/000110465926121068/tm2624997d8_ncsr.htm) and neither funds list includes it."
