    commitments:
      # Parts I and II of the SAI 'Proxy Voting' statement, one wording from 2021 to 2026. Read from the Global X Funds SAIs (485BPOS, dated by EDGAR filing date): one trust, many single-fund and multi-fund SAIs a year,
      # which differ in a printed page number (mid-sentence, 'various 29 shareholder proposals', 'Firm 27 The Advisor') and in 'the interests of the Fund[s] and the interests of the Adviser' (singular in single-fund SAIs):
      # both are removed by `strip_patterns` so the families do not alternate.
      - label: global-x-proxy-voting-statement-as-printed-in-sai
        adviser: "Global X Management Company LLC"
        adviser_key: "GLOBAL_X"
        sai_appendix:
          cik: "0001432353"
          forms: ["485BPOS"]
          since: "2021-01-01"
          allow_identical_copies: true
          start:
            - "I. General Guidelines Except in instances where the Adviser has provided Glass Lewis with different direction"
          end:
            - "III. Record of Proxy Voting"
          strip_page_numbers: true
          strip_patterns:
            - '(?<=[A-Za-z]) \d{1,3}(?= [A-Za-z])'
            - '(?<=interests of the )Funds?(?= and the interests of the Adviser)'
