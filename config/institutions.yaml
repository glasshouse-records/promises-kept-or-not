      # (DFAITC) and of DEM delegated voting for the Master Funds to the Advisor, and the feeder portfolios themselves hold no vote rows in the ledger, so no ballot is counted twice.
      # SERIES RULES (2026-11-18): the SAIs print ONE guideline summary per SAI. The Social summary is printed in the SAI of five DFAIDG series and the Sustainability
      # summary in the SAI of six DFAIDG series and of four Dimensional ETF Trust series; those series are keyed DFA_SOCIAL / DFA_SUSTAINABILITY, never DFA, from the first
