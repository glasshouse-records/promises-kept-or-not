          - "https://corporate.vanguard.com/content/dam/corp/advocate/investment-stewardship/pdf/policies-and-reports/us_proxy_voting_policy_2025.pdf"
      # Added 2026-11-17: the sibling policy for funds advised through Vanguard
      # Capital Management, LLC (Total Stock Market, 500, Extended Market,
      # Institutional Index, international index funds, ...). Listed at
      # https://corporate.vanguard.com/content/corporatesite/us/en/corp/about-our-funds/proxy-voting-across-funds/vanguard-capital-management.html
