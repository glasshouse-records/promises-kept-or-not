      # Verified 2026-11-18 (200, text/html, honest client). The policy is the page body, not a PDF, and the page text includes site navigation and a footer, so `body` bounds the policy:
      # from the Funds' preface heading to the page footer (the last footnote is kept; the footer marker is looked ahead to, not consumed; an old capture with no footer ends at its last sentence).
      # The page lived at /legal/proxy-voting-policies-and-procedures/ (Wayback 2023-07-06) and /legal/proxy-voting-policies-and-procedures.html (2022-05-26) before /corporate/ (2024-04-14).
      # Each capture prints an approval date: November 2021 (2022-05-26 capture), March 2023, 28 February 2024, 13 June 2024, 14 February 2025 (effective 1 March 2025), 10 February 2026 (effective 1 April 2026).
      - label: proxy-voting-policies-and-procedures
        url: "https://allspringglobal.com/corporate/proxy-voting-policies-and-procedures"
        former_urls:
          - "https://www.allspringglobal.com/legal/proxy-voting-policies-and-procedures/"
          - "https://www.allspringglobal.com/legal/proxy-voting-policies-and-procedures.html"
        adviser: "Allspring Funds Management, LLC"
        adviser_key: "ALLSPRING"
        # Version identity is the policy body only: the page navigation, cookie banner and footer changed between captures.
        body:
          start: 'Allspring Funds Proxy Voting Policies and Procedures Scope of Policies and Procedures'
          end: '(?=\s(?:LinkedIn\b|CFA®|Quick [Ll]inks\b))|$'
      # The same policy as printed in the Allspring Variable Trust SAI (one 485BPOS a year, filed in April), dated by EDGAR filing date. Separate label from the website page (different
      # formatting would invent alternating versions). One heading per printed wording; the section runs to the portfolio-holdings disclosure policy that follows, so the last sentence is kept; the page marks
      # "81 Back To Table of Contents" / "Variable Trust Funds 83 Back to Table of Contents" print inside the policy and are stripped. The SAI copy prints no approval date.
      - label: allspring-proxy-voting-policies-and-procedures-as-printed-in-sai
        adviser: "Allspring Funds Management, LLC"
        adviser_key: "ALLSPRING"
        sai_appendix:
          cik: "0001081402"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "Allspring Global Investments, LLC Proxy Voting Policies and Procedures Allspring Global Investments, LLC"
            - "Allspring Global Investments Proxy Voting Policies and Procedures Allspring Global Investments (Allspring) Stewardship"
            - "Allspring Global Investments Proxy Voting Policies and Procedures Introduction Allspring Stewardship"
          end:
            - "Policies and Procedures for Disclosure of Fund Portfolio Holdings I. Scope of Policies and Procedures."
          strip_patterns:
            - '(?:Variable Trust Funds )?\b\d{1,3} Back [Tt]o Table of Contents'
            - '\b\d{1,3} Variable Trust Funds Back [Tt]o Table of Contents'

