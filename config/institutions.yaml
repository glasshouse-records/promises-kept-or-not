    notes: "Principal Global Investors, LLC ('PGI', doing business as Principal Asset Management), Des Moines IA (CIK 769734, the 13-F filer, a subsidiary of Principal Financial Group, Inc. 1126328). PGI is the manager of the Principal Funds, Principal Variable Contracts Funds and Principal Exchange-Traded Funds and votes their proxies itself or through the sub-adviser each series names, under the Principal Asset Management Proxy Voting Policies and Procedures (which, since the 2021-10-27 SAI, names Principal Real Estate Investors, LLC as covered). PGI (769734) and Principal Real Estate Investors (1218333) also file institutional-manager N-PX reports (separate accounts and sub-advised mandates) that overlap the fund registrants' own tables and are not ingested here. aum_usd_tr is not verified."
    npx_ciks:
      # Added 2026-11-19. Principal's own US fund registrants that file N-PX vote tables with operating-company votes. Every SAI says 'The Board has delegated responsibility for decisions regarding proxy voting for
      # securities held by each Fund to PGI or to that Fund's Sub-Advisor, as appropriate. PGI and each Sub-Advisor will vote such proxies in accordance with its proxy policies and procedures ... found in Appendix C'.
      # So the registrant default is PRINCIPAL (PGI) and the exceptions are listed per series (`series_adviser`):
      #  - EXTERNAL: a series with any unaffiliated sub-adviser named for any portion of its assets in an SAI read (AllianceBernstein, Barrow Hanley, BlackRock, Brown Advisory, Causeway, DDJ/Polen, Eagle, Emerald, Hotchkis & Wiley,
      #    Los Angeles Capital, Mellon, MetLife, Nuveen, Pictet, T. Rowe Price, Vaughan Nelson, Victory, Westwood, Wellington, Westfield and others). The sub-adviser votes its own sleeve under its own printed policy and the N-PX does not split the sleeves.
      #  - SPECTRUM, ORIGIN: Principal affiliates that vote under their OWN printed policy (Spectrum Asset Management 'Policy on Proxy Voting', Origin Asset Management LLP 'Proxy Voting Policy'), so never paired with the PGI policy.
      #  - Principal Real Estate Investors (sub-adviser of the real-estate series) is covered by the PGI policy itself (its heading names PGI and PREI from the 2021-10-27 SAI on), so those series are PRINCIPAL from 2021-10-27 (the earliest SAI read whose PGI policy heading names it; UNRESOLVED before).
      #  - UNRESOLVED: no SAI establishes who votes (a Spectrum sleeve inside an otherwise PGI series; Origin Emerging Markets after Origin stops being named, 2024-12-27).
      # `from` is the EDGAR filing date of the earliest SAI read (2021); earlier meetings stay unlabelled. Not ingested: Principal Real Estate Income Fund (1557523, adviser ALPS Advisors, Inc.; PGI is not its adviser),
      # Principal Private Credit Fund and the other interval / private funds that file no vote table.
