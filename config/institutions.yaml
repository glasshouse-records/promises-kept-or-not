        adviser: "Amundi Asset Management US, Inc. to 2025-03-31, Victory Capital Management Inc. from 2025-04-01"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1305767/000182126821000037/pio81340ncsr.htm"  # N-CSR filed 2021-02-05 (0001821268-21-000037): the Pioneer fund's proxy policy is its adviser's (Amundi US / Pioneer Investment Management)
        adviser_verified: "2026-11-19"
        voting_note: "Closed-end fund (one fund per registrant). N-CSR Item 7 filed 2021-02-05 prints 'Proxy Voting Policies and Procedures of Pioneer Investment Management, Inc.'. Victory Capital was its adviser from 2025-04-01 to 2025-08-29 (interim agreement; N-CSR of 2026-02-05) and no N-CSR read prints Victory's policy for it: UNRESOLVED from 2025-04-01."
        adviser_key_history: [{key: AMUNDI_US, from: "2021-02-05", until: "2025-03-31"}, {key: UNRESOLVED, from: "2025-04-01"}]
        name: "Pioneer Floating Rate Fund, Inc."
        validated: "2026-11-19"   # entity name confirmed via data.sec.gov submissions API
    voting_scope_notes:
      - "Keyed VICTORY, per registrant, from the EDGAR filing date of the earliest SAI read: Victory Portfolios (802716) 2021-02-25 (0001683863-21-001022); Victory Portfolios III (908695, formerly USAA Mutual Funds Trust) 2021-02-05 (-000546); Victory Variable Insurance Funds (1068663) 2021-04-19 (-001958); Victory Portfolios II (1547580) 2021-09-28 (-005579). Earlier meetings stay unlabelled."
      - "Series exceptions: EXTERNAL for the five Victory Portfolios III series with an unaffiliated sub-adviser (Wellington: International, Science & Technology; Lazard: Emerging Markets; Loomis Sayles: Growth; Granahan: Small Cap Stock; Northern Trust: Growth and Tax Strategy to FY2023) and for the Victory Portfolios Global Energy Transition Fund (SailingStone); Park Avenue's High Yield, Floating Rate and Strategic Income series (and the Variable Insurance Funds High Yield VIP Series) are EXTERNAL to 2023-12-31 (last N-CEN naming Park Avenue), UNRESOLVED from 2024-01-01 (the SAIs of April 2024 still name it, the N-CEN of FY2024 does not) and VICTORY from the first SAI that no longer names it (2025-04-25 / 2025-04-14)."
      - "The Pioneer funds: AMUNDI_US to 2025-03-31 for every registrant (Amundi Asset Management US, Inc. was their adviser; Pioneer Series Trust XII and IV and the new Victory Portfolios IV / Variable Insurance Funds II tables also cover 2025 meetings). On 2025-04-01 Amundi US was combined with Victory Capital Holdings, its advisory agreements terminated and an interim agreement with Victory Capital took over (497 supplement of 2025-04-01); the open-end funds are VICTORY only from the first Victory Portfolios IV SAI (2025-07-25; Variable Insurance Funds II: 2026-04-29), the closed-end funds from their own first N-CSR that prints Victory's H-12 policy (Diversified High Income 2025-07-09, High Income 2026-06-04, Floating Rate never read). The weeks between are UNRESOLVED, not guessed."
      - "Pre-acquisition votes (Pioneer trusts, 2024 N-PX and the 2024-07 to 2025-03 part of the 2025 N-PX) are ingested under this institution because the registrants now belong to Victory, but they are NOT Victory's votes: the AMUNDI_US key keeps them apart in the engine. The Pioneer registrants that reported only to the year ended 2024-06-30 carry `npx_ended`."
      - "Policy text: Victory Capital's Proxy Voting Guidelines memo (vcm.com/assets/policies, one page a year: 2022 [dated 15 June 2023], the unnamed 'Proxy Voting Guidelines' [24 June 2024], 2025 [19 February 2025], 2026 [12 February 2026]; the memos document the guidelines adopted under Victory's internal Proxy Voting Policy, which is available on request) walked on the Wayback index under one label. Victory's full policy 'H-12 Proxy Policy' was at vcm.com/assets/policies/H-12 Proxy Policy.pdf and now answers 404 (two Wayback captures, 2021-01-20 and 2021-05-08, are not archived here). Under separate labels: the Adviser's Proxy Voting Policy and Procedures summary as printed in the Victory Portfolios II SAI (in-body section, one 485BPOS a year, single-trust SAIs only), Victory's H-12 policy as printed in Item 7 of the Pioneer Diversified High Income Fund N-CSR (2025, 2026), and Amundi US's policy as printed in Appendix B of the Pioneer Fund SAI (2021-2024)."
    commitments:
      # Verified 2026-11-19 (200, application/pdf, honest client). A one-page PDF memo, so no `body` bound; the memo date is printed on it. The file name changes each year (former_urls, read from the Wayback CDX index of
      # vcm.com/assets/policies: 2022-08-14, 2023-09-23, 2025-04-17, 2026-05-09 captures), walked by `glasshouse ingest commitments --wayback` under this one label.
      - label: proxy-voting-guidelines-memo
        url: "https://vcm.com/assets/policies/Proxy-Voting-Guidelines-2026.pdf"
        former_urls:
          - "https://vcm.com/assets/policies/Proxy-Voting-Guidelines-2025.pdf"
          - "https://vcm.com/assets/policies/Proxy%20Voting%20Guidelines.pdf"
          - "https://vcm.com/assets/policies/2022%20Proxy%20Voting%20Guidelines.pdf"
        adviser: "Victory Capital Management Inc."
        adviser_key: "VICTORY"
      # Victory's Proxy Voting Policies and Procedures section as printed in the Victory Portfolios II SAI (485BPOS, dated by EDGAR filing date): an in-body section from the 1940 Act paragraph to the next
      # heading. Separate label from the website memo. Single-trust SAIs only: the multi-trust SAIs print the heading several times and contribute nothing (the extractor wants exactly one).
      - label: victory-proxy-voting-policy-as-printed-in-sai
        adviser: "Victory Capital Management Inc."
        adviser_key: "VICTORY"
        sai_appendix:
          cik: "0001547580"
          forms: ["485BPOS"]
          since: "2021-01-01"
          # Victory Portfolios II files two SAI families: the multi-fund SAI ("held by the
          # Funds") and single-fund SAIs ("held by the Fund"). Read only the multi-fund one,
          # and strip the run of page numbers; mixing them produced phantom versions
          # (Fund/Funds wording and page numbers alternating, found 2026-11-19).
          start:
            - "PROXY VOTING POLICIES AND PROCEDURES In accordance with the 1940 Act, the Trust has adopted policies and procedures for voting proxies related to equity securities held by the Funds"
          end:
            - "PORTFOLIO TRANSACTIONS AND BROKERAGE"
          page_sequence: true
          # Lone page numbers (44 to 64 in the 2021-26 printings). The only other lone
          # numbers in the section are "June 30" and "August 1", which stay. The space a line
          # break leaves after a hyphen ("pay-for- performance") is folded by identity_text.
          # Some printings add a share-class phone number to the voting-record sentence
          # ("(800-539-3863), 800-235-8396 for Member Class, or"): share-class furniture,
          # not policy, and it alternates between same-season SAIs.
          strip_patterns:
            - '(?<=\s)[4-6]\d(?=\s)'
            - ',\s*800-235-8396 for Member Class,'
      # Victory's H-12 Proxy Voting policy as printed in Item 7 of the Pioneer Diversified High Income Fund N-CSR (first printed in the report filed 2025-07-09, the first after Victory became adviser).
      - label: victory-h-12-proxy-voting-policy-as-printed-in-n-csr
        adviser: "Victory Capital Management Inc."
        adviser_key: "VICTORY"
        sai_appendix:
          cik: "0001388126"
          forms: ["N-CSR"]
          since: "2025-01-01"
          start:
            - "H-12 PROXY VOTING BACKGROUND AND RISKS"
          end:
            - "ITEM 13. PORTFOLIO MANAGERS OF CLOSED-END MANAGEMENT INVESTMENT COMPANIES"
      # Amundi US's policy (the Pioneer Funds' Proxy voting policies and procedures) as printed in Appendix B of the Pioneer Fund SAI (one 485BPOS a year, to 2024), dated by EDGAR filing date. Pre-acquisition
      # policy: keyed AMUNDI_US, never VICTORY. The section runs to the Part C heading; the running 'Table of Contents' links, the run of page numbers (75, 76, ...) and the SAI's document code ('22123-14-0521 86') are stripped, so the 2021 and 2022 printings (and the 2023 and 2024 ones) are one version each.
      - label: amundi-us-proxy-voting-policy-as-printed-in-sai
        adviser: "Amundi Asset Management US, Inc."
        adviser_key: "AMUNDI_US"
        sai_appendix:
          cik: "0000078713"
          forms: ["485BPOS"]
          since: "2021-01-01"
          start:
            - "Appendix B — Proxy voting policies and procedures Policy Each of the Pioneer Funds"
          end:
            - "PART C - OTHER INFORMATION"
          page_sequence: true
          strip_patterns:
            - 'Table of Contents'
            - '\d{5}-\d{2}-\d{4}(?:\s+\d{1,3})?\s*$'
