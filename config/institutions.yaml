      # Adviser authority to vote proxies on the securities held in the Fund's portfolio and prints the Federated proxy voting policy under "Voting Proxies On Fund Portfolio
      # Securities". Exception, read fund by fund from the SAIs: for series sub-advised by Hermes Investment Management Limited (HIML) the SAI says "The Board has delegated to the
      # Adviser, and the Adviser has in turn delegated to the Sub-Adviser, the authority to vote proxies", under HIML's own Corporate Governance and Responsible Investment
      # Guidelines, and the Federated summary says it excludes "Hermes Investment Management, which maintains its own voting policy". Those series carry the separate key HERMES_HIML
