    voting_scope_notes:
      - "Keyed per SERIES, never per registrant: every PGIM SAI says the Board delegated proxy voting to the Manager (PGIM Investments LLC), which delegates to each Fund's subadviser(s); the SAI prints that subadviser's own policy in Appendix I. The voting subadviser per series is read from Form N-CEN (Item C.3), filed 2023-2026 for each trust (34 registrants). PGIM Quantitative Solutions LLC (formerly QMA LLC) is PGIM_QUANT, Jennison Associates LLC is JENNISON and PGIM, Inc. (with PGIM Limited and PGIM Real Estate (UK) Limited, whose SAIs print the one PGIM, Inc. appendix) is PGIM_INC."
      - "EXTERNAL = any unaffiliated subadviser named in any N-CEN read for the series (Prudential Series Fund and Advanced Series Trust portfolios run by J.P. Morgan, T. Rowe Price, Wellington, MFS, ClearBridge, Putnam and others, plus a few PGIM funds with outside sleeves). UNRESOLVED = two different PGIM voters in one series (the sleeve split is not in the N-PX), an affiliate whose own policy is not printed in any SAI read (PGIM Wadhwani LLP, PGIM DC Solutions LLC) or a subadviser change inside 2023-2026 (the Target Date funds moved from Quant Solutions to PGIM DC Solutions in 2024; PSF Global Portfolio and the PGIM Portfolio Ballast ETF also changed). N-CEN flags are not trusted over the name: a handful of rows flag Jennison Associates or PGIM Limited as unaffiliated and Wellington Management as affiliated; the keys follow the firm."
      - "Not ingested, not keyed: PGIM Investments LLC (1038001), PGIM, Inc. (946754) and PGIM Quantitative Solutions LLC (1316541), whose institutional-manager N-PX reports overlap the fund tables or are notices; Jennison Associates (53417, 13-F filer); the municipal and money-market trusts (Prudential National Muni Fund 314612, Prudential Government Money Market Fund 67590, Prudential Tax Free Money Fund 311561; municipal series inside the Investment Portfolios trusts are ingested and simply add no operating-company rows); PGIM Securities Investment Trust Enterprise (1666044, a Taiwan fund filing N-PX); PGIM Private Credit Fund (1923622, no N-PX); the Prudential Trust Company collective trusts, the PGIM real-estate, senior-loan and fixed-income private funds and the offshore (Ireland / Luxembourg / Cayman) vehicles, which file no US fund vote table."
      - "Policy text: the Jennison Associates Proxy Voting Policy and Procedures PDF on jennison.com (200 application/pdf to honest clients, file name 20260228, Wayback holds only that edition), and under separate labels the three affiliates' policies as printed in an SAI Appendix I: Jennison (Prudential Jennison Blend Fund SAIs), PGIM Quantitative Solutions (Target Portfolio Trust SAIs) and PGIM, Inc. (Investment Portfolios 4 SAIs). PGIM Quantitative Solutions and PGIM, Inc. publish no stand-alone policy document (their web pages are overviews saying the policy is available on request), so those two are archived through the SAI route only. The SAI Appendix I prints a description of the PGIM Quantitative Solutions and PGIM, Inc. policies and the full Jennison policy; the printed PGIM, Inc. text differs by trust (PGIM Real Estate approach, PGIM Credit)."
    commitments:
      # Verified 2026-11-19 (200, application/pdf, honest client). A PDF, so no `body` bound. The edition is named in the file ('20260228'); the Wayback index holds one capture (2026-05-16).
      - label: proxy-voting-policy-and-procedures
        url: "https://www.jennison.com/content/dam/jennison/us/en/active/documents/reports/proxy-voting/20260228%20Proxy%20Voting%20Policy%20and%20Procedures%20FINAL.pdf"
        adviser: "Jennison Associates LLC"
        adviser_key: "JENNISON"
      # The Jennison policy as printed in Appendix I of the Prudential Jennison Blend Fund SAI (one heading per annual 485BPOS, to Appendix II), dated by EDGAR filing date; page marks "NN Table of Contents"
      # and the fund-name footer are removed. Separate label from the website PDF. Stray page numbers inside a sentence (73, 75, 77) are not removed, so a page-number shift can read as an edit.
      - label: jennison-proxy-voting-policy-as-printed-in-sai
        adviser: "Jennison Associates LLC"
        adviser_key: "JENNISON"
        sai_appendix:
          cik: "0000356683"
          forms: ["485BPOS"]
          since: "2021-01-01"
          start:
            - "APPENDIX I: PROXY VOTING POLICIES OF THE SUBADVISER JENNISON ASSOCIATES LLC Proxy Voting Policy and Procedures"
          end:
            - "APPENDIX II: DESCRIPTIONS OF SECURITY RATINGS"
          strip_page_numbers: true
          strip_patterns:
            - 'PGIM Jennison Blend Fund \d{1,3}(?: Table of Contents)?'
            - '\d{1,3} Table of Contents'
      # The PGIM Quantitative Solutions description of its proxy voting policies as printed in Appendix I of the Target Portfolio Trust SAI. Retitled across editions (QMA, 'PGIM Quant Solutions').
      - label: pgim-quantitative-solutions-proxy-voting-policy-as-printed-in-sai
        adviser: "PGIM Quantitative Solutions LLC"
        adviser_key: "PGIM_QUANT"
        sai_appendix:
          cik: "0000890339"
          forms: ["485BPOS"]
          since: "2021-01-01"
          start:
            - "APPENDIX I: PROXY VOTING POLICIES OF THE SUBADVISER PGIM Quantitative Solutions LLC Description of PGIM Quantitative Solutions LLC Proxy Voting Policies"
            - "APPENDIX I: PROXY VOTING POLICIES OF THE SUBADVISER PGIM QUANTITATIVE SOLUTIONS LLC (“PGIM Quant Solutions”) Description of Proxy Voting Policies"
            - "APPENDIX I: PROXY VOTING POLICIES OF THE SUBADVISER PGIM QUANTITATIVE SOLUTIONS LLC (“PGIM Quantitative Solutions”) PROXY VOTING Description of Proxy Voting Policies"
          end:
            - "APPENDIX II: DESCRIPTIONS OF SECURITY RATINGS"
          strip_page_numbers: true
      # The PGIM, Inc. policy (PGIM Fixed Income, PGIM Real Estate and other investment groups) as printed in Appendix I of the Prudential Investment Portfolios 4 SAI (PGIM Muni High Income Fund); the
      # fund-name footer is removed. The 2026 edition prints a shorter PGIM Credit description.
      - label: pgim-inc-proxy-voting-policy-as-printed-in-sai
        adviser: "PGIM, Inc."
        adviser_key: "PGIM_INC"
        sai_appendix:
          cik: "0000807394"
