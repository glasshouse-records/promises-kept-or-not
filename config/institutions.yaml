      # Verified 2026-11-18 (200, application/pdf, honest client, Last-Modified 2026-11-17, PDF title '2026 Proxy Voting Policies and Procedures', dated January 1, 2026).
      # The PDF sits under mfs.com's /microsites/meridian/ path; the policy page itself (mfs.com ... /proxy-voting.html) links no PDF in its markup, so this is the only direct copy found.
      - label: proxy-voting-policies-and-procedures
        url: "https://www.mfs.com/content/dam/mfs-enterprise/microsites/meridian/proxy_voting_procedures.pdf"
        adviser: "Massachusetts Financial Services Company"
        adviser_key: "MFS"
      # The same policy as restated in the December 485BPOS supplement of Series Trust I, dated by EDGAR filing date. Separate label from the website PDF
      # (different formatting would invent alternating versions). The lead-in sentence and the footer ("MULTI-SAI-SUP-I-122925 8", page numbers) are stripped.
      - label: mfs-proxy-voting-policies-as-printed-in-sai
        adviser: "Massachusetts Financial Services Company"
        adviser_key: "MFS"
        sai_appendix:
          cik: "0000798244"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "restated in its entirety as follows: APPENDIX E – PROXY VOTING POLICIES AND PROCEDURES MASSACHUSETTS FINANCIAL SERVICES COMPANY PROXY VOTING POLICIES AND PROCEDURES"
            - "restated in its entirety as follows: APPENDIX E - PROXY VOTING POLICIES AND PROCEDURES MASSACHUSETTS FINANCIAL SERVICES COMPANY PROXY VOTING POLICIES AND PROCEDURES"
          end: ["Statement of Additional Information December"]
          strip_patterns:
            - '^restated in its entirety as follows: APPENDIX E [–-] PROXY VOTING POLICIES AND PROCEDURES'
            - '(?:\b\d{1,2} )?MULTI-SAI-SUP-I-\d{6}(?: \d{1,2}\b)?'

