        adviser_source: "https://www.sec.gov/Archives/edgar/data/1845809/000092881621000572/a2_etfcombo.htm"  # 485BPOS (SAI) filed 2021-05-20 (0000928816-21-000572), 'Proxy Voting Guidelines and Procedures': the Trustees delegated to Putnam Management the responsibility for voting the funds' proxies
        adviser_verified: "2026-11-18"
        voting_note: "SAI 'Proxy Voting Guidelines and Procedures': 'The Trustees of the funds have delegated to Putnam Management the responsibility for the voting of proxies for the securities held in the funds' portfolios. Putnam Management has established proxy voting guidelines and procedures, which will apply to the voting of proxies for the funds as well as for other investment advisory clients' (2021); the 2023-2026 SAIs word it as the Putnam Funds' Trustees (2026: the Board of Trustees) having delegated proxy voting authority to Putnam Management and approved its procedures, attached as Appendix A. The sub-advisory description of PanAgora (an affiliate of Putnam Management, sub-adviser of the Putnam PanAgora ESG ETFs) covers investment decisions for its portion of the fund and does not assign it proxy voting, so no series is EXTERNAL. Series with votes: Putnam BDC Income, BioRevolution, Em Markets ex-China, Focused Large Cap Growth, Focused Large Cap Value, PanAgora ESG Em Mkt Eq, PanAgora ESG Intl Eq, Sustainable Future, Sustainable Leaders (the ESG bond ETFs and the Franklin municipal ETFs added in 2026 file a notice)."
        adviser_key_history: [{key: PUTNAM, from: "2021-05-20"}]
        name: "Putnam ETF Trust"
        validated: "2026-11-18"   # entity name confirmed via data.sec.gov submissions API
    voting_scope_notes:
      - "Two adviser groups. FRANKLIN: Franklin Custodian Funds (38721) from 2021-01-26 (SAI 0001379491-21-000215) and Franklin ETF Trust (1551895) from 2021-07-28 (0001379491-21-003455); each SAI says the board delegated voting to the investment manager, Franklin Advisers, Inc. PUTNAM: the Putnam Funds and the Putnam ETF Trust, from each registrant's earliest SAI whose Part II says the Trustees delegated proxy voting to Putnam Management (Putnam Funds Trust and Putnam High Yield Fund 2023-03-27, Putnam Variable Trust 2023-04-28, Putnam Investment Funds 2023-06-27, Putnam International Equity Fund 2023-10-26, George Putnam Balanced Fund 2023-11-27, Putnam Global Health Care Fund 2023-12-28, Putnam Asset Allocation Funds 2023-12-29, Putnam Diversified Income Trust 2024-01-25, Putnam Convertible Securities Fund, Putnam Large Cap Value Fund and Putnam Focused International Equity Fund 2024-02-26, Putnam ETF Trust 2021-05-20). The accessions are in each registrant's adviser_source."
      - "Regime change inside the Putnam funds: SAIs to 2023-02-28 say the Trustees of the Putnam Funds established the proxy voting guidelines and that the Director of Proxy Voting and Corporate Governance, a member of the Office of the Trustees, directed the votes (the Putnam Funds' own guidelines, not Putnam Management's). From 2023-03-27 the SAIs say the Trustees delegated proxy voting authority to Putnam Management and approved its procedures, and print a footnote 'Effective January 27, 2023, the Board of Trustees of the Putnam Mutual Funds delegated proxy voting authority to Putnam Investment Management, LLC.' Each registrant is keyed PUTNAM only from its OWN first SAI of the new wording; its meetings before that stay unlabelled (a known loss of coverage for the registrants whose first such SAI is late: Large Cap Value, Convertible Securities and Focused International Equity, 2024-02-26, so meetings 2023-07-01 to 2024-02-25 are unlabelled), never guessed from a sister trust's filing."
      - "No Putnam rule ends: the SAIs read to 2026-10-26 (Putnam Funds Trust 0001193125-26-431489, Putnam Variable Trust 0001193125-26-410580) still say the Board delegated voting to Putnam Management and print the Putnam Investments Proxy Voting Procedures, although Franklin Advisers, Inc. became the Investment Manager of some series in 2025-26 (the Franklin Asset Allocation, Franklin Multi-Asset Income, Franklin Dynamic AA Equity and Franklin Retirement Advantage funds) with Putnam Management as sub-adviser whose services 'may include ... proxy voting'. The procedures route items on securities held solely in accounts managed by the Global Asset Allocation team within Franklin Templeton Investment Solutions to that team's portfolio managers for a recommendation; the vote is still cast under the Putnam procedures."
      - "No series is keyed EXTERNAL. Putnam Investments Limited and The Putnam Advisory Company act under the same procedures. PanAgora Asset Management, Inc. (sub-adviser of the Putnam PanAgora ESG ETFs, an affiliate of Putnam Management) is described as making investment decisions for its portion; no SAI gives it proxy voting."
      - "Not ingested: Putnam Investment Management, LLC (81273), The Putnam Advisory Company (81238) and Putnam FL Investment Management (1140334) file institutional-manager N-PX reports for their own accounts and for funds they sub-advise, which overlap the fund tables, so they would double count. Notice-only registrants (no votes in 2024-26): Putnam Money Market Fund (81248), Putnam Income Fund (81264), Putnam Global Income Trust (794614), Putnam California Tax Exempt Income Fund (711402). High Income Securities Fund (810943) was renamed from Putnam High Income Securities Fund in 2018 and is not Putnam-managed. Putnam registrants whose last N-PX is 2021-23 (Investors Fund, Global Natural Resources, Arizona Tax Exempt and earlier) have no meeting in 2023-07-01 to 2026-06-30."
      - "The Franklin ETF Trust N-CSR refers to a subadviser without naming one (https://www.sec.gov/Archives/edgar/data/1551895/000113322826008749/fetft-efp24615_ncsr.htm) while the SAI says voting is delegated to Franklin Advisers, Inc. (https://www.sec.gov/Archives/edgar/data/1551895/000165558926000971/c485bpos.htm); no sub-adviser voting was identified, but the series affected were not established. Its N-PX reports are notices."
    commitments:
      # Franklin Equity Group Proxy Voting Policies & Procedures (franklintempleton.com),
      # verified 2026-06-26 (200, application/pdf). The policy of the two FRANKLIN registrants.
      - label: proxy-voting-policies-procedures
        url: "https://www.franklintempleton.com/forms-literature/download/FEG_ProxyVotingPolicies"
        adviser: "Franklin Advisers, Inc."
        adviser_key: "FRANKLIN"
      # Putnam Investments Proxy Voting Procedures (the policy of the PUTNAM registrants): franklintempleton.com, 200 application/pdf to honest clients
      # (probed 2026-11-18), first page "March 28, 2025". A PDF, so no `body` bound. The same lineage was served at putnam.com
      # (`/static/pdf/proxy/proxy_voting_procedures_guidelines.pdf`, March 26, 2021 edition, Wayback 2021-10-28 and 2022-03-25). putnam.com's
      # `/static/pdf/proxy/proxy_voting_guidelines.pdf` is NOT walked: its 2014-2021 captures are the Putnam Funds' own Trustee guidelines (a different
      # document) and it still serves the July 1, 2024 edition live.
      - label: putnam-investments-proxy-voting-procedures
        url: "https://www.franklintempleton.com/forms-literature/download/PI-PVG"
        former_urls:
          - "https://www.putnam.com/static/pdf/proxy/proxy_voting_procedures_guidelines-f6887a00711c0c4e65cd1526b1ee7830.pdf"
          - "https://www.putnam.com/static/pdf/proxy/proxy_voting_procedures_guidelines.pdf"
        adviser: "Putnam Investment Management, LLC"
        adviser_key: "PUTNAM"
      # The same procedures as printed in Appendix A of the Putnam Variable Trust SAI (one 485BPOS a year, April, plus one in October 2026): the one
      # Putnam registrant whose annual SAI prints the policy in one arrangement (the multi-series trusts file many differently typeset SAIs a year).
      # Separate label from the website PDF. Read from "Putnam Investments Proxy Voting Procedures Introduction and Summary" (the dated line above it
      # is dropped: the Franklin-era SAIs omit it) to the Part C heading, so the last sentence of the certification is kept; the SAI's page numbers
      # (a bare number at every page foot from 2025, "Month D, YYYY II- n" before) and bullet glyphs and signature blanks are removed.
      - label: putnam-investments-proxy-voting-procedures-as-printed-in-sai
        adviser: "Putnam Investment Management, LLC"
        adviser_key: "PUTNAM"
        sai_appendix:
          cik: "0000822671"
          forms: ["485BPOS"]
          since: "2023-04-01"
          allow_identical_copies: true
          page_sequence: true
          start:
            - "Putnam Investments Proxy Voting Procedures Introduction and Summary"
          end:
            - "PUTNAM VARIABLE TRUST FORM N-1A PART C"
            - "Item 28. Exhibits"
          strip_patterns:
            - '(?:[A-Z][a-z]+ \d{1,2}, \d{4} )?II- ?\d{1,3}'
            - '(?<= )(?:[•Ø►➢➣▪●○◦·§◾]|o)(?= )'
            - '_{2,}'
          # A declared reprint is kept (row + file) but grouped with the previous edition's
          # identity, which stays dated by its own earliest filing (METHODOLOGY).
          reprints:
            - accession: "0001193125-26-163054"
              same_as_previous: true
              reason: "re-print of the 2025-04-28 edition: one list item moved across a page break, '15 %' spacing, a split word; no wording change (diffed 2026-11-19)"
              checked: "2026-11-19"

