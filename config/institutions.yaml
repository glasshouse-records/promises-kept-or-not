      - "Policy text: Parametric's own website (parametricportfolio.com) rejects requests that identify themselves honestly (403, 2026-11-18), so no website copy is archived (see METHODOLOGY source-access notes). The SAI of Eaton Vance Series Trust II printed Parametric's own policy in the 2023, 2024 and 2025 editions (archived as parametric-proxy-voting-policy-as-printed-in-sai); the 2026 SAIs instead print the Morgan Stanley Investment Management Equity Proxy Voting Policy (which lists Parametric Portfolio Associates LLC as a covered MSIM affiliate), a different document that is not archived under Parametric's key: it is archived under its own key, PARAMETRIC_MSIM, as the copy those SAIs print (msim-equity-proxy-voting-policy-parametric-as-printed-in-sai, from the filing of 2026-04-28)."
    commitments:
      # The SAI of the single-fund Parametric Tax-Managed Emerging Markets Fund prints Parametric's own policy as its Appendix C (2023, 2024, 2025 editions; the
      # 2026 editions print the MSIM Equity policy instead and contribute nothing, since the start marker is absent). Page footers ("Parametric Tax-Managed
      # Emerging Markets Fund 109 SAI dated November 1, 2024") stay inside the text: constant within an edition, and every edition is a genuinely re-dated policy.
      - label: parametric-proxy-voting-policy-as-printed-in-sai
        adviser: "Parametric Portfolio Associates LLC"
        adviser_key: "PARAMETRIC"
        sai_appendix:
          cik: "0000074663"
          forms: ["485BPOS"]
          since: "2023-01-01"
          start: "PARAMETRIC PORTFOLIO ASSOCIATES LLC PROXY VOTING POLICIES AND PROCEDURES"
          end: "PART C - OTHER INFORMATION"
          strip_page_numbers: true
      # Added 2026-11-18: the text the Parametric series' OWN 2026 SAIs print instead (keyed PARAMETRIC_MSIM, the key their votes carry from the SAI date): the Morgan Stanley
      # Investment Management Equity Proxy Voting Policy and Procedures, January 2026, as Appendix G / E / C of the Eaton Vance Mutual Funds Trust SAIs (the Commodity Strategy,
      # Emerging Markets, International Equity and Volatility Risk Premium - Defensive SAIs, 0001133228-26-006989 and -26-008463; the Series Trust II SAI of 2026-10-27 prints
      # the identical text). A separate label from the MSIM-keyed one (a different, differently formatted copy; never reuse the MSIM key). Each filing prints several SAIs, so
      # the copies must be identical; the policy is followed directly by the next SAI's cover or by Part C, and the printed footer (G-9, E-9, C-9) marks its end.
      - label: msim-equity-proxy-voting-policy-parametric-as-printed-in-sai
        adviser: "Morgan Stanley Investment Management (policy printed in the Parametric series' SAIs)"
        adviser_key: "PARAMETRIC_MSIM"
        sai_appendix:
          cik: "0000745463"
          forms: ["485BPOS"]
          since: "2026-01-01"
          start: "Morgan Stanley Investment Management (“MSIM”) Equity Proxy Voting Policy and Procedures January 2026 Introduction"
          end: ["G-9", "E-9", "C-9"]
          allow_identical_copies: true
          strip_patterns:
            - '\b[A-G]- ?\d{1,2}\b'
            - 'Back [Tt]o Table of Contents'

