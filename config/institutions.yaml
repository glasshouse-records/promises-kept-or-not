      - "Vanguard Investor Choice (SAI Appendix B, same SAI URL) lets shareholders of listed index funds direct their pro-rata votes under other policies; it was not verified how those votes are reported in the N-PX."
      - "Bond, money-market and Treasury ETF series on file (S000002233, S000026859-S000026865, S000059555, S000062658, S000090172, S000090173) have no vote rows and both funds lists exclude fixed income funds, so they carry no team key."
