      - "The archive holds four pre-split Vanguard policy captures (Wayback 2022-01-17, 2023-01-28, 2024-03-03, 2025-02-09, the Feb 2023/2024/2025 editions); any amendment between those captures is not archived, so votes in that window are compared against the nearest earlier edition on file."
