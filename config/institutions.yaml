      # policies and procedures, and (from the October 2023 edition) prints the Adviser's proxy voting policy as an appendix. The only outside voter ever named is Intech Investment
      # Management LLC (a Janus-controlled sub-adviser with its own policy): the Janus Investment Fund SAI of 2021-10-28 says "Janus Capital or Intech, as applicable" and its
      # sub-advisory agreements for the four Intech Managed Volatility funds were terminated 2022-04-05 (exhibit (d)(64) of the 2022-10-28 filing); the Janus Aspen Series SAI of
      # 2022-04-29 says "the Adviser or Intech, as applicable" (U.S. Low Volatility Portfolio, interim sub-advisory agreement dated 2022-03-31) and the 2023-04-28 SAI no longer does.
      # `from` is therefore the EDGAR filing date of the first 485BPOS (SAI) read in which the Adviser alone votes every series; earlier meetings stay unlabelled, which also
      # keeps the Intech-voted series out of the dated window, so no series is EXTERNAL. Kapstream (Absolute Return Income Opportunities Fund) and the other foreign affiliates act under
      # personnel-sharing arrangements, "subject to the oversight and supervision of the Adviser"; the SAI voting delegation to the Adviser carries no carve-out for them.
