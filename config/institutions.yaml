    npx_ciks:
      # Added 2026-11-19. The twelve First Trust open-end registrants that file N-PX vote tables (ETF V and VII file notice reports only: no operating-company votes). Every SAI read prints the same section 'Proxy Voting Policies
      # and Procedures': 'The Board has delegated to First Trust the proxy voting responsibilities for the Fund[s] ... First Trust has engaged ISS to make recommendations to First Trust on the voting of proxies ... First Trust
      # has adopted the ISS Proxy Voting Guidelines. While these guidelines are not intended to be all-inclusive, they do provide guidance on First Trust's general voting policies ... First Trust retains final authority and
      # fiduciary responsibility for proxy voting.' Two eras, dated per trust from the EDGAR filing date of the SAI that shows them (no SAI of any trust reverts):
      #  - FIRST_TRUST_ISS: from the earliest SAI read (2021-01-15 to 2021-11-24) until the day before the SAI that first says 'The First Trust Proxy Voting Guidelines [Policies and Procedures] are attached hereto'. Until then the
      #    exhibit is ISS's own Concise Proxy Voting Guidelines (Benchmark Policy), which is not archived here (ISS copyright); the key does not pretend the policy is First Trust's own.
      #  - FIRST_TRUST: from that SAI (2022-09-30 to 2023-04-28), because the SAI then attaches First Trust Advisors L.P.'s own written Proxy Voting Guidelines / Policies and Procedures (Exhibit B), which says FTA will generally
      #    follow the ISS guidelines (the SAIs of 2024 still say so) and, from the 2025 SAIs, the 'First Trust U.S. / International Proxy Voting Guidelines'. ISS executes the votes in both eras.
      #  - EXTERNAL: a series whose OWN single-fund SAI says 'The Board has delegated to [Cboe] Vest / WCM / the Sub-Advisor the day-to-day proxy voting responsibilities' (the Sub-Advisor's policy is its Exhibit). The multi-fund annual
      #    SAIs of the same trust still say First Trust for these series (they list every series of the trust); the series' own SAI is the more specific statement and the N-CEN names the same sub-adviser, so the own SAI wins. A series
      #    whose N-CEN names a sub-adviser (Stonebridge, RiverFront, Horizon, SSI, Confluence, Energy Income Partners on the older funds, TCW, Wellington/Sands, SkyBridge) but whose SAIs all say First Trust votes keeps the registrant key.
      #    Only series with N-PX votes carry a rule: a series with no votes yet needs none, but a future one must be read from its own SAI.
