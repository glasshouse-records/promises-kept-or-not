# Glasshouse institution registry.
# Adding ANY filer = one entry here. `cik` is the 13-F filing CIK (the manager /
# registered adviser, not always the top-level holding company). `npx_ciks` lists
# the fund trusts / registrants that file N-PX vote reports for this institution.
# CIKs verified against SEC EDGAR 2026-05-29 (carried from predecessor registry).

institutions:
  jpmorgan:
    display_name: "JPMorgan Chase & Co."
    short_name: "JPMorgan"
    cik: "0000019617"
    country: "USA"
    type: "bank"
    aum_usd_tr: 3.4
    notes: "Largest US bank; 13-F filed by JPMorgan Chase & Co. aum_usd_tr is J.P. Morgan Asset Management's managed AUM (~$3.4T), the voting footprint — not the bank's total assets. N-PX trusts are JPMAM US fund trusts."
    npx_ciks:
      # Discovered + verified 2026-06-26. Two clean US JPMAM fund trusts filing
      # N-PX. Deliberately EXCLUDED the discover noise: the non-US adviser
      # entities (JPMAM UK/Japan/Canada/Taiwan/Asia-Pacific Ltd), the bank
      # itself (JPMorgan Chase Bank N.A.), and single closed-end/specialty funds
      # — only these two attribute cleanly to JPMAM's US fund voting.
      - cik: "1217286"
        adviser: "J.P. Morgan Investment Management Inc. (JPMIM); no sub-adviser in this trust"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1217286/000119312526433347/d350863d485bpos.htm"  # 485BPOS filed 2026-10-27; N-CSR 2026-09-08 names no sub-adviser
        adviser_verified: "2026-11-17"
        voting_note: "Outside-sub-advised funds such as Behavioral Value (FullerThaler, voting delegated to it) sit in the separate Undiscovered Managers Funds trust, which is not registered here."
        name: "JPMorgan Trust I"
        validated: "2026-06-26"
      - cik: "1303608"
        adviser: "J.P. Morgan Investment Management Inc. (JPMIM); no sub-adviser"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1303608/000119312526211596/d115273dncsr.htm"  # N-CSR filed 2026-05-07; sole series is JPMorgan Core Bond Trust (bond fund, little or no equity voting)
        adviser_verified: "2026-11-17"
        name: "JPMorgan Institutional Trust"
        validated: "2026-06-26"
    commitments:
      # Canonical, verified 2026-06-26 (200, application/pdf): JPMAM "Global Proxy
      # Voting Procedures and Guidelines" from am.jpmorgan.com.
      - label: global-proxy-voting-procedures-and-guidelines
        url: "https://am.jpmorgan.com/content/dam/jpm-am-aem/americas/us/en/supplemental/proxy-information/global-procedures-and-guidelines.pdf"

  blackrock:
    display_name: "BlackRock Inc."
    short_name: "BlackRock"
    cik: "0001364742"
    country: "USA"
    type: "asset_manager"
    aum_usd_tr: 10.0
    notes: "World's largest asset manager by AUM."
    npx_ciks:
      - cik: "1100663"
        adviser: "BlackRock Fund Advisors (BFA); affiliate sub-advisers BlackRock International Limited and BlackRock (Singapore) Limited for some series"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1100663/000119312526389481/d122292d485bpos.htm"  # 485BPOS filed 2026-09-14 (SAI Proxy Voting Policies)
        adviser_verified: "2026-11-17"
        voting_note: "Board delegates voting to BFA under two policies by series: Index Equity Fund policy (BIS Global Benchmark Policy, the archived one) or the Open-End Active and Fixed Income Index Fund policy (BlackRock Active Investment Stewardship Guidelines, now also archived). Both policies are effective 2025-01-01; before that one Open-End Fund Proxy Voting Policy covered all funds. Series-by-series assignment read from the policy table in each 485BPOS SAI filed 2025-02-25 to 2026-09-14."
        adviser_key: "BIS"
        series_adviser:
          S000045644: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
          S000048637: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
          S000051261: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
          S000059297: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
          S000075472: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
        # UNRESOLVED from 2025-01-01: series with post-2025 votes that appear in no 2025-26 SAI policy table, so BIS vs BAIS could not be established (see voting_scope_notes).
        # Re-checked 2026-11-17 against all 45 iShares Trust (CIK 1100663) 485BPOS filings of 2025-02-25..2026-09-14: none names any of the four closed series below.
        #  S000004310 iShares Core S&P 500 ETF: it has its OWN Proxy Voting Policy (Appendix A-1 of 485BPOS 0001193125-26-318131, filed 2026-07-27,
        #    https://www.sec.gov/Archives/edgar/data/1100663/000119312626318131/d132601d485bpos.htm). Effective 2025-01-01, a voting-choice program: eligible
        #    shareholders pick BIS Global Benchmark or one of seven third-party policies (Egan-Jones, Glass Lewis, ISS); BIS is only the default for non-electing
        #    shares. The other iShares SAIs (e.g. 0001193125-26-064179) exclude it from the index-equity BIS policy. A single BIS key would mislabel the
        #    third-party-policy shares, so it stays UNRESOLVED.
        #  S000017779 (International Developed Property), S000065014 (Future Cloud 5G and Tech), S000075506 (Emergent Food and AgTech), S000076619 (MSCI Water
        #    Management): no 2025-26 SAI names them, so no filing states a policy. Last votes 2025-04-30 / 2025-08-20 / 2025-06-18 / 2025-08-15. IDAT, IVEG and IWTR
        #    were liquidated 2025-08-21 (BlackRock product-update release of 2025-06-13); that is context, not a policy statement.
        #  S000035387, S000049572, S000066851, S000069338 (no votes after 2024-12-31) and S000036005 (iShares, Inc., CIK 930667, no votes after 2024-12-31) are not keyed past 2024.
          S000004310: [{key: BIS, until: "2024-12-31"}, {key: UNRESOLVED, from: "2025-01-01"}]
          S000017779: [{key: BIS, until: "2024-12-31"}, {key: UNRESOLVED, from: "2025-01-01"}]
          S000065014: [{key: BIS, until: "2024-12-31"}, {key: UNRESOLVED, from: "2025-01-01"}]
          S000075506: [{key: BIS, until: "2024-12-31"}, {key: UNRESOLVED, from: "2025-01-01"}]
          S000076619: [{key: BIS, until: "2024-12-31"}, {key: UNRESOLVED, from: "2025-01-01"}]
        name: "iShares Trust"
        validated: "2026-06-10"
      # Added 2026-11-16: brand-named INDEX trusts only. Actively managed and
      # externally sub-advised trusts are deliberately left out — their votes
      # may be cast by another adviser, and attributing those to this manager
      # is the one error that cannot be tolerated here.
      - cik: "930667"
        adviser: "BlackRock Fund Advisors (BFA); affiliate sub-advisers BlackRock International Limited and BlackRock (Singapore) Limited may be appointed"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/930667/000119312526361244/d146002d485bpos.htm"  # 485BPOS filed 2026-08-21
        adviser_verified: "2026-11-17"
        voting_note: "Same two-policy split as iShares Trust (BIS benchmark policy for index equity funds; BAIS guidelines for active and fixed income index funds), effective 2025-01-01. Series assignment read from the policy table in each 485BPOS SAI filed 2025-02-25 to 2026-08-21."
        adviser_key: "BIS"
        series_adviser:
          S000036906: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
          S000036907: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
        name: "iShares, Inc."
        validated: "2026-11-16"   # entity name confirmed via data.sec.gov submissions API
      - cik: "1524513"
        adviser: "BlackRock Fund Advisors (BFA); affiliate sub-adviser BlackRock International Limited for some bond series"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1524513/000119312526064208/d97039d485bpos.htm"  # 485BPOS filed 2026-02-23
        adviser_verified: "2026-11-17"
        voting_note: "Every series in the 2025-02-25, 2025-11-21 and 2026-02-23 SAI policy tables (27 funds) follows the Active and Fixed Income Index policy, i.e. BlackRock Active Investment Stewardship guidelines, from 2025-01-01; before that date the single Open-End Fund Proxy Voting Policy applied."
        adviser_key: "BAIS"
        adviser_key_history: [{key: BIS, until: "2024-12-31"}, {key: BAIS, from: "2025-01-01"}]
        name: "iShares U.S. ETF Trust"
        validated: "2026-11-16"   # entity name confirmed via data.sec.gov submissions API
      - cik: "1026144"
        adviser: "BlackRock Advisors, LLC (investment manager); sub-adviser BlackRock Fund Advisors (affiliate)"
        adviser_source: "https://www.sec.gov/Archives/edgar/data/1026144/000119312526177154/d82299d485bpos.htm"  # 485BPOS filed 2026-04-24
        adviser_verified: "2026-11-17"
        voting_note: "Part I of the SAI marks the Index Equity Fund Proxy Voting Policy (BIS benchmark policy) for both series (MSCI EAFE International Index Fund, Russell 2000 Small-Cap Index Fund) in the 485BPOS filed 2025-04-25 and 2026-04-24."
        adviser_key: "BIS"
        name: "BlackRock Index Funds, Inc."
        validated: "2026-11-16"   # entity name confirmed via data.sec.gov submissions API
    voting_scope_notes:
      - "BAIS and BIS policies for open-end funds are both effective 2025-01-01; before that a single Open-End Fund Proxy Voting Policy (effective 2021-08-01) covered every fund (SAI filed 2024-12-30, https://www.sec.gov/Archives/edgar/data/1100663/000119312524286021/d853591d485bpos.htm; SAI Appendix A, https://www.sec.gov/Archives/edgar/data/1100663/000119312526389481/d122292d485bpos.htm)."
      - "Series assignment (BIS 253 and BAIS 9 of the 272 series with vote rows) was read from the per-fund policy table of each 485BPOS SAI filed 2025-02-25 to 2026-09-14 and never changed between filings; it is a statement of the 2025-26 position applied back to 2025-01-01."
      - "Ten series have vote rows but no row in any 2025-26 SAI policy table, so their policy was not established: S000004310 (iShares Core S&P 500 ETF), S000017779, S000035387, S000036005, S000049572, S000065014, S000066851, S000069338, S000075506, S000076619; the five with votes after 2024-12-31 (S000004310, S000017779, S000065014, S000075506, S000076619) are keyed UNRESOLVED from 2025-01-01. Re-checked 2026-11-17 across all 45 iShares Trust 485BPOS filings of 2025-02-25 to 2026-09-14: iShares Core S&P 500 ETF has its own Proxy Voting Policy (485BPOS 0001193125-26-318131) under which eligible shareholders choose BIS or a third-party policy, so no single key is correct; the other nine are named in no 2025-26 SAI, three of them (IDAT, IVEG, IWTR) were liquidated 2025-08-21 and S000017779 is not confirmed either way, so they stay UNRESOLVED."
      - "The BIS archive entry is the Global Principles; the SAI says the BIS Global Benchmark Policy also comprises regional voting guidelines and engagement priorities that are available only on request, so those are not archived (https://www.sec.gov/Archives/edgar/data/1100663/000119312526389481/d122292d485bpos.htm)."
      - "BAIS guidelines state that fundamental equity portfolio managers receive voting recommendations and may vote differently (https://www.blackrock.com/gls-download/literature/publication/blackrock-active-investment-stewardship-engagement-and-voting-guidelines.pdf, p. 4), so a BAIS-series vote is not necessarily a vote in line with the guidelines."
      - "Some funds also follow supplemental climate and decarbonization guidelines marked in the same SAI table; those supplements are not archived and not separated here."
    commitments:
      # URLs verified live before being added; rotted URLs are findings too
      # (the non-response ledger will track disappearing policies).
      - label: investment-stewardship-global-principles
        url: "https://www.blackrock.com/gls-download/literature/publication/blackrock-investment-stewardship-benchmark-global-principles.pdf"
        # verified 2026-11-17: 200, application/pdf; linked from blackrock.com's
        # own "BlackRock Investment Stewardship" page. Text is identical to the
        # last live capture (same text_sha256), so the series continues unbroken.
        # Previous URL (verified 2026-06-11, soft-404 since 2026-11-17: 301 to
        # /gls-download/... then 302 to the site error page):
        #   https://www.blackrock.com/corporate/literature/fact-sheet/blk-responsible-investment-engprinciples-global.pdf
        adviser: "BlackRock Investment Stewardship (BIS): index equity funds from 2025-01-01; every fund before that date"
        adviser_key: "BIS"
      # Added 2026-11-17: BlackRock Active Investment Stewardship (BAIS) Global
      # Engagement and Voting Guidelines, the policy for the Open-End Active and
      # Fixed Income Index Fund Proxy Voting Policy series (effective 2025-01-01
      # per the SAI Appendix A of the iShares 485BPOS filings). Verified 2026-11-17:
      # 200, application/pdf, "Effective as of January 2026" (PDF created 2025-12-19).
      # The January 2025 edition ("Effective as of January 2025") was served at
      # https://blackrock.com/corporate/literature/publication/blackrock-active-investment-stewardship-engagement-and-voting-guidelines.pdf
      # and is in the Wayback Machine (capture 20250118053239); that old path now
      # serves the current edition, so version history lives in the lineage.
      - label: active-investment-stewardship-guidelines
        url: "https://www.blackrock.com/gls-download/literature/publication/blackrock-active-investment-stewardship-engagement-and-voting-guidelines.pdf"
        adviser: "BlackRock Active Investment Stewardship (BAIS)"
        adviser_key: "BAIS"
        adviser_key_history: [{key: BAIS, from: "2025-01-01"}]

