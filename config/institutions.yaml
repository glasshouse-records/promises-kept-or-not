      - "Policy text: the Neuberger Berman Proxy Voting Policies and Procedures PDF (nb.com handlers/documents.ashx?id=e6b2f962-93ae-48b5-854e-627c89b3ea7f; /proxy-voting redirects to it). www.nb.com answers honest requests with a Vercel bot challenge (HTTP 429, x-vercel-mitigated: challenge) that Glasshouse does not evade, so the live copy cannot be captured; the editions are archived from the Wayback Machine (captures 2022-05-17 to 2026-05-11: editions January 2022, February 2023, March 2024, February 2025, and a re-issue of the February 2025 edition with 'NB' spelled 'Neuberger' and renumbered headings). Under a separate label, the policy as printed in Appendix B of the Advisers Management Trust SAI (one copy per annual 485BPOS; heading to Part C; page marks 'B- n' removed). The SAIs print an edition up to two years late (April 2019 in the SAIs of 2022 and 2023), so SAI dates are upper bounds."
    commitments:
      # nb.com is gated by a bot challenge (429), so this label is filled by the Wayback walk (id_ endpoint); a live fetch is logged as a failed attempt. /proxy-voting redirected here;
      # the nameless address (what /proxy-voting redirected to) is listed first because the Wayback walk records the first capture of each text it meets: it holds the earliest captures
      # (2022-05, 2024-07, 2024-11, 2025-04), the `&name=` address (2022-07, 2023-08, 2025-11, 2026-05) the later ones. The policy is the PDF, so no `body` bound is needed.
      - label: proxy-voting-policies-and-procedures
        url: "https://www.nb.com/handlers/documents.ashx?id=e6b2f962-93ae-48b5-854e-627c89b3ea7f"
        former_urls:
          - "https://www.nb.com/handlers/documents.ashx?id=e6b2f962-93ae-48b5-854e-627c89b3ea7f&name=S0301_nb_proxy_policy_procedures"
        adviser: "Neuberger Berman Investment Advisers LLC"
        adviser_key: "NEUBERGER_BERMAN"
        access: {status: blocked, reason: "nb.com answers honest clients with a Vercel bot challenge (429); documented in METHODOLOGY, never evaded", checked: "2026-11-18"}
      # The same policy as printed in Appendix B of the Advisers Management Trust SAI, dated by EDGAR filing date. Separate label from the website PDF (different formatting would invent
      # alternating versions). One heading per printed edition; the section runs to Part C of the registration statement; the page marks "B- 3" are stripped.
      - label: neuberger-berman-proxy-voting-policies-and-procedures-as-printed-in-sai
        adviser: "Neuberger Berman Investment Advisers LLC"
        adviser_key: "NEUBERGER_BERMAN"
        sai_appendix:
          cik: "0000736913"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "APPENDIX B APRIL 2019 PROXY VOTING POLICIES AND PROCEDURES I. INTRODUCTION AND GENERAL PRINCIPLES"
            - "Appendix B March 2024 Proxy Voting Policies and Procedures I. Introduction and General Principles"
            - "Appendix B Proxy Voting Policies and Procedures February 2025 I. Introduction and General Principles"
          end:
            - "PART C OTHER INFORMATION"
          strip_patterns:
            - '\bB- ?\d{1,2}\b'
            # The page header "Proxy Voting Policies and Procedures" (upper case in the 2019 edition) falls at a different spot in each filing and would mint a
            # phantom version of unchanged text; only the edition heading (after "2019", "2024" or "Appendix B") keeps the title.
            - '(?<!2019)(?<!2024)(?<!Appendix B) (?:PROXY VOTING POLICIES AND PROCEDURES|Proxy Voting Policies and Procedures)'

