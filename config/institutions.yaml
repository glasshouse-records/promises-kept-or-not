    voting_scope_notes:
      - "Three guideline documents: Standard (key DFA), Sustainability (key DFA_SUSTAINABILITY) and Social (key DFA_SOCIAL). Series are assigned from the SAI that prints the summary: Social = U.S. Social Core Equity 2, Emerging Markets / International / Global Social Core Equity, DFA Social Fixed Income; Sustainability = U.S. / International / Emerging Markets Sustainability Core 1, U.S. Sustainability Targeted Value, Dimensional World ex U.S. Sustainability Targeted Value, DFA Global Sustainability Fixed Income, and the four Sustainability Core 1 / Global Sustainability Fixed Income ETFs of Dimensional ETF Trust. They are keyed from the first SAI read that splits them (2024-02-28, accessions 0001741773-24-000695 and 0001741773-24-000697; World ex U.S. Sustainability Targeted Value from 2025-02-28); the 2023 SAIs (0000930413-23-000711) print a single summary, so meetings before 2024-02-28 keep the registrant default DFA. A DFA_SOCIAL or DFA_SUSTAINABILITY vote is paired only with its own guideline text. Series not named in any Social or Sustainability SAI stay DFA; the Standard guideline text says the Advisor may still weigh social or sustainability issues for such portfolios."
      - "Possible incompleteness, not established: the 2025 and 2026 vote exhibits of DFA Investment Dimensions Group (CIK 355437) and Dimensional ETF Trust (CIK 1816125) each hold exactly 500,000 proxyTable records (2024: 486,275 and 468,237), and the 2026 DFA Investment Dimensions Group exhibit covers 31 series. Whether the filer or EDGAR capped them was not verified (accessions 0001680359-25-000726, 0002071844-26-001087, 0001680359-25-000722, 0002071844-26-001088), so Dimensional counts are lower bounds and must not be read as the complete vote record."
      - "The master funds DFA Investment Trust Co (CIK 896162) and Dimensional Emerging Markets Value Fund (CIK 896163) are covered from 2026-11-18. They file N-PX but have no SAI of their own; the feeder SAIs state the Advisor votes for the Master Funds. Several of their reports are notice-only (no votes held), recorded as filings without votes."
    commitments:
      # Verified 2026-11-17 (200, application/pdf), linked from https://www.dimensional.com/us-en/who-we-are/investment-stewardship
      - label: summary-of-standard-proxy-voting-guidelines
        url: "https://www.dimensional.com/chmedia/428704/source/download/summary-of-standard-proxy-voting-guidelines.pdf"
        adviser: "Dimensional Fund Advisors LP"
        adviser_key: "DFA"
      # The Standard summary AS PRINTED in the DFAIDG SAIs (485BPOS), dated by EDGAR filing date; a SEPARATE label from the website PDF (different formatting).
      # One 485BPOS binds many SAIs; each prints ONE exhibit: the Standard one (headed "Exhibit A Summary of Proxy Voting Guidelines", "Exhibit A Proxy Voting
      # Guidelines" in the 2023 SAI), the Social one ("... Summary of Social ...") or the Sustainability one. The Standard heading never matches those two, so
      # they are never captured; all Standard copies must extract identically (allow_identical_copies) or the filing yields nothing. The exhibit ends at its last
      # printed page (A- 17; A- 19 in 2023), the cover of the next SAI follows: the ends name that page marker plus the first words of the cover, which
      # keeps the exhibit's final sentence and drops the cover.
      - label: summary-of-standard-proxy-voting-guidelines-as-printed-in-sai
        adviser: "Dimensional Fund Advisors LP"
        adviser_key: "DFA"
        sai_appendix:
          cik: "0000355437"
          forms: ["485BPOS"]
          since: "2023-01-01"
          start: ["Exhibit A Summary of Proxy Voting Guidelines", "Exhibit A Proxy Voting Guidelines"]
          end: ["A- 17 DFA INVESTMENT DIMENS", "A- 17 INSTITUTIONAL CLASS SHARES", "A- 19 DFA INVESTMENT DIMENS", "A- 19 INSTITUTIONAL CLASS SHARES", "PART C OTHER INFORMATION"]
