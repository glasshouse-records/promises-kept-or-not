    voting_scope_notes:
      - "Keyed CMIA, per trust, from the effective date of the earliest SAI read (2023-03-01 to 2023-08-01): Columbia Funds Series Trust I (773757), Series Trust II (1352280), Columbia Funds Series Trust (1097519), Columbia Acorn Trust (2110), Columbia ETF Trust I (1551950) and Columbia ETF Trust II (1450501). Each trust's SAI says the Funds delegated proxy voting to Columbia Management Investment Advisers, LLC, including Funds managed by subadvisers, in every edition read (2023 to 2026). Earlier meetings stay unlabelled; SAIs from before 2023 were not read."
      - "Columbia Pyrford International Stock Fund (S000074123, Series Trust II) is kept out of CMIA (EXTERNAL, not paired with any policy) until 2026-04-30: the Corporate Governance Guidelines printed in the SAI carried the endnote that they do not apply to Pyrford International Limited through the March 1, 2026 SAIs, so who voted its proxies is unclear; the SAI dated May 1, 2026 drops the note and the series is keyed CMIA from 2026-05-01."
      - "Second pass (2026-11-18): Columbia Funds Variable Insurance Trust (815425, keyed CMIA from the SAI dated 2023-05-01, accession 0001193125-23-117412), Columbia Funds Variable Series Trust (929521, keyed CMIA only from the SAI dated 2026-05-01, accession 0001193125-26-179394: until 2025-07-07 it was Wanger Advisors Trust with Columbia Wanger Asset Management as Investment Manager, so earlier meetings stay unlabelled) and the closed-end Tri-Continental Corporation (99614) and Columbia Seligman Premium Technology Growth Fund (1471420), keyed from the N-CSR filed 2023-03-03 (0001683863-23-001735, -23-001719; Item 7 prints the same delegation). No series was keyed EXTERNAL: the Variable Insurance Trust SAIs name Pyrford only as a former subadviser, and every SAI says the Investment Manager votes for subadvised Funds too."
