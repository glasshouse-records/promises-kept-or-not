    voting_scope_notes:
      - "Keyed GLOBAL_X from the EDGAR filing date of the earliest SAI read (Global X Funds 2021-01-04); earlier meetings stay unlabelled. The policy is the Adviser's own written Proxy Voting Policies, adopted by the Trust, which Glass Lewis executes ('Except in instances where the Adviser has provided Glass Lewis with different direction, Glass Lewis has agreed to vote proxies in accordance with recommendations developed by Glass Lewis and overseen by the Advisor'). No SAI says a sub-adviser or any other party votes under its own policy."
      - "Addenda: the SAIs of 2021-2026 say the Adviser also adopted a Catholic voting policy addendum (S&P 500 Catholic Values, S&P Catholic Values Developed ex-U.S.) or an ESG addendum (Renewable Energy Producers, Conscious Companies, CleanTech/ClimateTech, Autonomous & Electric Vehicles, Cloud Computing, Education, Telemedicine & Digital Health/HealthTech, Clean Water, Hydrogen, Wind Energy, Solar, Green Building, Nasdaq 100 ESG and S&P 500 ESG Covered Call) for named funds. The addendum text is not printed, so those 16 series are keyed GLOBAL_X_CATHOLIC / GLOBAL_X_ESG (no policy text, policy_in_force answers none) from the first SAI read that names the fund (list edition per SAI family: Oct-31 family 2021-02-23, 2024-02-28, 2025-02-20, 2026-02-26; Nov-30 family 2021-03-24, 2022-03-24, 2023-03-29, 2024-03-27, 2025-03-26, 2026-03-27) to the day before the first later SAI of its family that omits them; before the first naming and after an omission the key is UNRESOLVED."
