      #    are PGIM_INC: the SAIs print one 'PGIM, Inc.' appendix for them, covering PGIM Fixed Income, PGIM Real Estate and the other investment groups).
      #  - EXTERNAL: any unaffiliated subadviser named for any part of the series (the N-PX does not split sleeves).
      #  - UNRESOLVED: two different PGIM voters (e.g. Jennison plus Quant Solutions), an affiliate whose own policy no SAI read prints (PGIM Wadhwani, PGIM DC Solutions), or a subadviser change inside the window.
      #  - no rule (unlabelled): no subadviser at all (funds of funds run by PGIM Investments), or a series absent from every N-CEN read.
