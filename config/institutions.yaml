          S000079695: [{key: UNRESOLVED, until: "2024-02-27"}, {key: GLOBAL_X_ESG, from: "2024-02-28", until: "2025-02-19"}, {key: UNRESOLVED, from: "2025-02-20"}]   # Nasdaq 100 ESG Covered Call ETF (named only 2024-02-28)
          S000079699: [{key: UNRESOLVED, until: "2024-02-27"}, {key: GLOBAL_X_ESG, from: "2024-02-28", until: "2025-02-19"}, {key: UNRESOLVED, from: "2025-02-20"}]   # S&P 500 ESG Covered Call ETF (named only 2024-02-28)
