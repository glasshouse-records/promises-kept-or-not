    voting_scope_notes:
      - "Keyed ALLIANCEBERNSTEIN, per registrant, from the EDGAR filing date of the earliest 485BPOS (SAI) read (the closed-end Global High Income Fund, 906013, from its N-CSR of 2022-06-03): Bond Fund (3794), Global Bond Fund (883676), Institutional Funds (1018592) and Bernstein Fund (1653463) 2022-01-28, High Income Fund (915845) 2022-01-31, Cap Fund (81443), Core Opportunities (1090504), Equity Income (910036), Global Real Estate Investment (1018368), Global Risk Allocation (69752), Relative Value (29292) and AB Trust (1129870) 2022-03-01, Variable Products Series Fund (825316) 2022-04-29, Discovery Growth (19614), Large Cap Growth (889508), Portfolios (812015), Sustainable Global Thematic (350181) and Sustainable International Thematic (920701) 2022-10-28, Active ETFs (1496608) 2023-02-14. The earlier AB filings of the funds whose first annual SAI was dated October 2021 were not opened. No series is EXTERNAL: no SAI read names an outside voter; the AB Multi-Manager Select sub-advisory agreements listed as exhibits of the Cap Fund registration statement are 2017 exhibits, not a voting delegation."
      - "Not ingested, not keyed: registrants whose N-PX is a notice report with no vote table (AB Corporate Shares 1274676, AB Fixed Income Shares 862021, AB Municipal Income Fund II 899774, AllianceBernstein National Municipal Income Fund 1162027, AB Multi-Manager Alternative Fund 1543188, Bernstein Fund II 1166729), series-level notice filings of trusts that also file a voting report (Bond Fund, Active ETFs, Variable Products), and registrants whose last N-PX is before the window (AB Unconstrained Bond Fund 1002718, AB Government Exchange Reserves 917713, AB Pooling Portfolios 1308576, AB Blended Style Series 1172221, older AllianceBernstein funds). The Global Bond Fund, High Income Fund and Global High Income Fund tables are tiny (a handful of bankruptcy-related operating-company ballots plus AB Fixed-Income Shares ballots) but are real votes by AB and are ingested."
      - "Policy text: the AllianceBernstein Proxy Voting and Governance Policy PDF from alliancebernstein.com (the policy pages, e.g. /nz/en/institutions/proxy-and-governance.html, are navigation plus a link to /content/dam/corporate/corporate-pdfs/AB-Proxy-Voting-and-Governance-Policy.pdf; the same PDF is requested directly, so no `body` bound is needed) and, under a separate label, as printed in Appendix A of the AB Large Cap Growth Fund SAI (one copy per annual 485BPOS; read from the policy heading to Part C; page marks 'A- n' and 'Table of Contents' removed). That fund's SAI is used because its single October annual cycle prints each edition once; the AB Cap Fund filings alternate between typographic renderings of one edition (straight versus curly quotes, 'DC' versus 'D.C.') and would invent alternating versions. Other AB registrants carried an edition earlier than this fund's SAI (the 2023 rewrite in the Cap Fund SAI of 2023-06-30, the 2025 edition in the Cap Fund SAI of 2025-07-28), so the dates are upper bounds."
    commitments:
      # Verified 2026-11-18 (200, application/pdf, honest client; first page 'October 2025'). The policy pages are navigation plus this link, so the PDF is the policy.
      - label: proxy-voting-and-governance-policy
        url: "https://www.alliancebernstein.com/content/dam/corporate/corporate-pdfs/AB-Proxy-Voting-and-Governance-Policy.pdf"
        adviser: "AllianceBernstein L.P."
        adviser_key: "ALLIANCEBERNSTEIN"
      # The same policy as printed in Appendix A of the AB Large Cap Growth Fund SAI, dated by EDGAR filing date. Separate label from the website PDF (different formatting
      # would invent alternating versions). The section runs from the policy heading to Part C of the registration statement; the page marks "A- 5" and "Table of Contents"
      # that follow each SAI's pagination are stripped.
      - label: alliancebernstein-proxy-voting-and-governance-policy-as-printed-in-sai
        adviser: "AllianceBernstein L.P."
        adviser_key: "ALLIANCEBERNSTEIN"
        sai_appendix:
          cik: "0000889508"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "Proxy Voting and Governance Policy Statement Introduction"
          end:
            - "PART C OTHER INFORMATION"
          strip_patterns:
            - '\bA- ?\d{1,2}\b(?: Table of Contents)?'

