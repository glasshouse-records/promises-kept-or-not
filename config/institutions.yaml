    voting_scope_notes:
      - "Keyed MFS, per registrant, from the SAI cover date of the earliest SAI read (each registrant's own first 485BPOS of 2022, or 2025-06-27 for the MFS Active Exchange Traded Funds Trust, whose first SAI is 2025-06-26): Series Trusts I (798244) and IV (63068) 2022-12-29, II (798250) and Massachusetts Investors Growth Stock Fund (63090) 2022-03-30, III (225604) 2022-05-31, V (200489) and XI (911637) 2022-01-28, VI (863032), VIII (819673), IX (63075), X (783740) and XV (764719) 2022-02-28, VII (318874) 2022-11-28, XII (1330967) 2022-08-26, XIII (356349) 2022-06-28, XVI (63067) and XVII (867969) 2022-10-24, Variable Insurance Trusts I-III (918571, 719269, 1065698) and Massachusetts Investors Trust (63091) 2022-04-29. The two closed-end bond funds (MFS Charter Income Trust 851170, MFS Intermediate High Income Fund 833021) are keyed from their N-CSR filed 2023-01-19. Earlier meetings stay unlabelled. Votes cast by MFS for the MFS Series Trust XIV money-market portfolio and similar are not separated."
      - "Not ingested, not keyed: MFS Municipal Series Trust (751656), MFS High Income Municipal Trust (845606), Investment Grade Municipal Trust (847411), High Yield Municipal Trust (809844) and the MFS Series Trust XIV money-market portfolio (1392417): they hold municipal bonds or money-market instruments, so their N-PX carry no equity votes (the 2025 filings hold one or a few bond-issuer or money-market-fund ballots). The MFS Institutional / LLC private vehicles and the 2023-08 legacy-HTML N-PX are not ingested. 13-F holdings (CIK 912938) not ingested here."
      - "Policy text: the MFS Proxy Voting Policies and Procedures, from mfs.com (a PDF on the official site that answers honest clients with 200) and, under a separate label, as printed in Appendix E of the Series Trust I SAI. Each December 485BPOS carries a supplement that restates Appendix E for the coming 1 January and also prints the edition then in force in the SAI itself, so a filing holds two different editions; only the restated supplement (heading plus 'restated in its entirety as follows') is read, which dates each edition to the December filing that announced it (2022-12-28 for 1 January 2023, 2023-12-28, 2024-12-26, 2025-12-29). The edition of 1 January 2022 and earlier is not archived. Footers (supplement code and date, page numbers) are stripped."
    commitments:
      # Verified 2026-11-18 (200, application/pdf, honest client, Last-Modified 2026-11-17, PDF title '2026 Proxy Voting Policies and Procedures', dated January 1, 2026).
      # The PDF sits under mfs.com's /microsites/meridian/ path; the policy page itself (mfs.com ... /proxy-voting.html) links no PDF in its markup, so this is the only direct copy found.
      - label: proxy-voting-policies-and-procedures
        url: "https://www.mfs.com/content/dam/mfs-enterprise/microsites/meridian/proxy_voting_procedures.pdf"
        adviser: "Massachusetts Financial Services Company"
        adviser_key: "MFS"
      # The same policy as restated in the December 485BPOS supplement of Series Trust I, dated by EDGAR filing date. Separate label from the website PDF
      # (different formatting would invent alternating versions). The lead-in sentence and the footer ("MULTI-SAI-SUP-I-122925 8", page numbers) are stripped.
      - label: mfs-proxy-voting-policies-as-printed-in-sai
        adviser: "Massachusetts Financial Services Company"
        adviser_key: "MFS"
        sai_appendix:
          cik: "0000798244"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "restated in its entirety as follows: APPENDIX E – PROXY VOTING POLICIES AND PROCEDURES MASSACHUSETTS FINANCIAL SERVICES COMPANY PROXY VOTING POLICIES AND PROCEDURES"
            - "restated in its entirety as follows: APPENDIX E - PROXY VOTING POLICIES AND PROCEDURES MASSACHUSETTS FINANCIAL SERVICES COMPANY PROXY VOTING POLICIES AND PROCEDURES"
          end: ["Statement of Additional Information December"]
          strip_patterns:
            - '^restated in its entirety as follows: APPENDIX E [–-] PROXY VOTING POLICIES AND PROCEDURES'
            - '(?:\b\d{1,2} )?MULTI-SAI-SUP-I-\d{6}(?: \d{1,2}\b)?'

