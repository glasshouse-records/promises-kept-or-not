      - "Series exceptions were read from the 'Sub-Advisor / Fund(s)' tables of the 485BPOS SAIs of Principal Funds (15 filings 2021-02-24 to 2026-08-25), Variable Contracts (7) and the ETFs (14). A series is EXTERNAL if ANY SAI read names an unaffiliated sub-adviser for ANY portion of it (precision over recall: some now run by PGI, e.g. Inflation Protection after 2025, stay EXTERNAL). Series that only a Principal affiliate sub-advises are SPECTRUM, ORIGIN or PRINCIPAL (Principal Real Estate Investors is named in the PGI policy heading and in its scope sentence 'refers specifically to PGI and Principal Real Estate Investors, LLC'). Funds of funds (LifeTime, SAM, Diversified Balanced/Growth) and index series are PGI's and keep the registrant key; PGI votes the underlying-fund shares in proportion to other holders."
