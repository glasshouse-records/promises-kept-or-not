      - "Not ingested, not keyed: Money Market Obligations Trust (856517), Municipal Securities Income Trust (866700), Premier Municipal Income Fund (1199004) and Short-Intermediate Duration Municipal Trust (353101) (their N-PX hold only Nuveen and BlackRock fund ballots, no operating-company votes), the Core Trust (1034106; no 485BPOS SAI exists to establish who votes, so its 2024-26 N-PX of bankruptcy ballots stays out), and registrants whose N-PX is a notice report with no vote table (Adjustable Rate Securities Trust 771524, Core Trust III 1411674, Government Income Trust 357052, Intermediate Municipal Trust 770116, International Series 742286, Investment Series Funds 889388, Municipal Bond Fund 201801, Project and Trade Finance Tender Fund 1677615, Short-Intermediate Government Trust 357159, Short-Term Government Trust 739594, Total Return Government Bond Fund 946868, Total Return Series 912763; Government Income Securities 355691 last filed 2024). The 2023-08 legacy-HTML N-PX and the institutional-manager reports (1279012, 1279010, 1086431, 1056508, 1013143) are not ingested."
      - "Policy text: the Federated advisers' 'Proxy Voting Policies and Procedures: Voting Client Securities' summary (form 50404), a PDF served by Federated's own document server (services.federatedinvestors.com, `teamsite-file-server`, with a `token` query string; the new federatedhermes.com site links no US adviser policy, only the EOS and Hermes UK voting guidelines) and, under a separate label, as printed in the Federated Hermes Global Allocation Fund SAI (one copy per annual 485BPOS, read from 'Proxy Voting Policies As an investment adviser' to 'Proxy Voting Report A report on'; page numbers 30-49 that print inside the policy removed). That fund's SAI is used because a single-fund SAI prints one copy once a year; the multi-fund Federated SAIs print differing copies (different advisers) and would invent versions. No text prints an edition date; the PDF's own metadata dates its two editions (April 2020, January 2024). Other trusts carried each SAI edition earlier than this fund's SAI, so the SAI-printed dates are upper bounds."
    commitments:
      # Verified 2026-11-18 (200, application/pdf, honest client; PDF title 'PROXY VOTING POLICIES AND PROCEDURES', Keywords 50404, created 2024-01-23). The tokenless path answers 200
      # with an empty body, the token query string (the Wayback-captured one, which the server still accepts) returns the PDF. The policy is the PDF, so no `body` bound is needed.
      - label: federated-advisors-proxy-voting-policies
        url: "https://services.federatedinvestors.com/teamsite-file-server/content/Federated+Advisors+-+Proxy+Voting+Policies?token=ZGFmXHBkZlxhYm91dF9mZWRlcmF0ZWRcaW52ZXN0b3JfcmVsYXRpb25zXDUwNDA0LnBkZg%3D%3D%7C1%7CMCwCFG7KcuCeq7PPXTI19wh6SDnMwsRqAhRnm%2BVkj2CPHSh8y2A7YDFFVpN6aA%3D%3D"
        adviser: "Federated Hermes advisory companies (Federated Hermes, Inc.)"
        adviser_key: "FEDERATED_HERMES"
      # The same policy as printed in the Federated Hermes Global Allocation Fund SAI, dated by EDGAR filing date. Separate label from the website PDF (different formatting would
      # invent alternating versions). Page numbers 30-49 print mid-text and shift by edition, so they are stripped. The section ends at the N-PX availability paragraph, after the
      # policy's last sentence ("...how the proposal shall be voted.").
      - label: federated-hermes-proxy-voting-policies-as-printed-in-sai
        adviser: "Federated Hermes advisory companies (Federated Hermes, Inc.)"
        adviser_key: "FEDERATED_HERMES"
        sai_appendix:
          cik: "0000013386"
          forms: ["485BPOS"]
          since: "2022-01-01"
          start:
            - "Proxy Voting Policies As an investment adviser with a fiduciary duty to the Fund and its shareholders"
          end:
            - "Proxy Voting Report A report on"
          strip_patterns:
            - '(?<![\w$(./,-])[3-4]\d(?![\w%.,)/-])'

