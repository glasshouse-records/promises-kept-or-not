      - "Policy text: the MFS Proxy Voting Policies and Procedures, from mfs.com (a PDF on the official site that answers honest clients with 200) and, under a separate label, as printed in Appendix E of the Series Trust I SAI. Each December 485BPOS carries a supplement that restates Appendix E for the coming 1 January and also prints the edition then in force in the SAI itself, so a filing holds two different editions; only the restated supplement (heading plus 'restated in its entirety as follows') is read, which dates each edition to the December filing that announced it (2022-12-28 for 1 January 2023, 2023-12-28, 2024-12-26, 2025-12-29). The edition of 1 January 2022 and earlier is not archived. Footers (supplement code and date, page numbers) are stripped."
