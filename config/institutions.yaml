      - "One policy, the Capital Group Proxy Voting Procedures and Principles, covers CRMC and its advisory affiliates; the SAI says final voting authority is held by a committee of the appropriate equity investment division, so one CRMC vote may be cast by different divisions (https://www.sec.gov/Archives/edgar/data/44201/000005193126001095/ck0000044201-20261030.htm). Divisions are not separated here."
      - "Only the 37 trusts listed were verified (American Funds Income Series, CIK 770161, files only a notice report, so it carries no vote rows); American Funds has further trusts (bond funds, target-date series, the Capital Group Fixed Income ETF Trust, the KKR co-branded (plus) ETFs, which are sub-advised, and Capital Group Portfolio Series) that are not covered."
