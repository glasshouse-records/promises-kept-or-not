    display_name: "PGIM (Prudential Financial: PGIM Investments LLC and its subadvisers)"
    short_name: "PGIM"
    cik: "0000946754"
    country: "USA"
    type: "asset_manager"
    aum_usd_tr: 0.0
    notes: "PGIM, Inc., Newark NJ, the global investment-management business of Prudential Financial, Inc. (CIK 1137774). PGIM, Inc. (CIK 946754) files only 13F-NT notices (13F holdings are reported by affiliates: Jennison Associates LLC 53417 files the 13F-HR), so the 13-F side is not ingested here. The US mutual funds are managed by PGIM Investments LLC (CIK 1038001), to which each trust's Board delegates proxy voting; PGIM Investments in turn delegates voting to each series' subadviser, which votes under its OWN policy (Jennison Associates, PGIM Quantitative Solutions, PGIM, Inc.'s investment groups such as PGIM Fixed Income and PGIM Real Estate, or an unaffiliated subadviser). Each series is therefore keyed by its voting subadviser (series_adviser), never by registrant. PGIM Investments (1038001), PGIM, Inc. (946754) and PGIM Quantitative Solutions (1316541) also file institutional-manager N-PX reports that are not ingested. aum_usd_tr is not verified."
    npx_ciks:
      # Added 2026-11-19. PGIM's own US fund registrants (the Prudential Investment Portfolios trusts, Prudential Jennison / World / Sector / Short-Term Corporate Bond / Global Total Return funds, Target Portfolio
      # Trust, PGIM ETF Trust and PGIM Rock ETF Trust, the Prudential Series Fund and Advanced Series Trust variable-insurance trusts, and five closed-end / interval funds) that file N-PX vote tables. Every SAI says
      # 'The Board has delegated to the Manager the responsibility for voting any proxies ... The Manager delegates to the Fund's subadviser(s) the responsibility for voting proxies' and prints the subadviser's own
      # policy in Appendix I (the closed-end funds' N-CSR say the same of the Fund's subadviser). So there is NO registrant default; each series carries a rule (`series_adviser`), read from the trust's own Form N-CEN
      # Item C.3 sub-adviser table (every N-CEN filed 2023-01 to 2026-11 read; the SAIs name the subadvisers only in prose and one SAI covers several funds):
