[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasshouse"
version = "0.1.0"
description = "Autonomous institutional-accountability watchdog: what financial institutions commit to vs. what they actually do (hold, vote, finance, stay silent about)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "ruff>=0.6", "semgrep>=1.0"]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.40"]
# Optional: emit researcher-grade typed/columnar Parquet in `glasshouse release`.
# The release always emits open CSV without this; Parquet is the analysis-grade
# upgrade. Kept optional so the core stays lean (CSV is the zero-dep floor).
release = ["pyarrow>=14.0"]

[project.scripts]
glasshouse = "glasshouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glasshouse.seed" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# NOTE: mutation testing (Trail of Bits mutation-testing skill) is a wanted
# follow-up — mutmut 3.x's mutants/ sandbox doesn't resolve this project's
# src-layout editable install, so it needs a dedicated runner venv before it
# runs clean. Tracked rather than shipped half-working.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Trail of Bits modern-python leans toward select=["ALL"]; we start with the
# high-signal sets that catch real bugs (not stylistic churn) for a mature
# codebase, and grow the selection over time.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET"]
ignore = [
    "E501",    # long lines are mostly SQL/CSS strings; semgrep guards what matters
    "SIM115",  # inline open() in tests/CLI one-shots is fine here
    "SIM102",  # nested ifs read clearer than combined in the matcher
    "B905",    # zip strict= not needed where lengths are construction-guaranteed
    "SIM113",  # manual counter is clearer than enumerate() over lxml iterparse
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
