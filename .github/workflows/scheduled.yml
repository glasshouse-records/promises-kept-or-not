# Scheduler = GitHub Actions ONLY. Files-first; nothing to babysit.
# These jobs are inert until the repo is pushed to GitHub (publication is
# currently deferred by the maintainer).
name: Scheduled runs

on:
  schedule:
    - cron: "17 11 * * *"   # daily: enforcement event scan
    - cron: "31 6 20 2,5,8,11 *"  # quarterly: 13-F (45 days after quarter end)
    - cron: "45 7 5 9 *"    # annual: N-PX (proxy-season close, filings due Aug 31)
  workflow_dispatch:

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Restore ledger artifact
        uses: actions/cache@v4
        with:
          path: data/glasshouse.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Daily event scan
        run: |
          glasshouse init-db
          glasshouse scan-events --news
          glasshouse ingest enforcement --source fed
          glasshouse ingest enforcement --source dockets
          glasshouse dedupe
          glasshouse diff --record
          glasshouse digest
        env:
          GLASSHOUSE_CONTACT: ${{ vars.GLASSHOUSE_CONTACT }}
      - name: Self-diagnosis (emits repair task for the source-medic agent)
        run: glasshouse doctor || true
      - name: Build PUBLIC artifacts (site = approved findings only; snapshot = publishable rows only)
        run: |
          glasshouse site
          glasshouse export
      # Publishable artifact: the static site and the public snapshot contain
      # only approved findings + non-duplicate primary-source rows. Safe to
      # expose on a public repo.
      - uses: actions/upload-artifact@v4
        with:
          name: public-${{ github.run_number }}
          path: |
            data/_site/
            data/exports/
          if-no-files-found: ignore
      # Operator-internal outputs (event-alert leads, the doctor/repair brief,
      # the digest draft) are NOT published — they hold unreviewed name-level
      # joins and queue state. On a public repo these stay out of artifacts;
      # the operator reviews them locally or via a private runner.
