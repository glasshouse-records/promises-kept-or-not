# Scheduler = GitHub Actions ONLY. Files-first; nothing to babysit.
# These jobs are inert until the repo is pushed to GitHub (publication is
# currently deferred by the maintainer).
name: Scheduled runs

on:
  schedule:
    - cron: "17 11 * * *"   # daily: enforcement event scan + policy capture
    - cron: "23 5 * * 0"    # weekly: Wayback backfill for newly-added sources
    - cron: "31 6 20 2,5,8,11 *"  # quarterly: 13-F (45 days after quarter end)
    - cron: "45 7 5 9 *"    # annual: N-PX (proxy-season close, filings due Aug 31)
  workflow_dispatch:

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Restore ledger artifact
        uses: actions/cache@v4
        with:
          path: data/glasshouse.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Daily event scan
        # Must not be able to skip the policy capture below it: this step runs
        # several network ingests under `bash -e`, and any raise would abort the
        # job before the one capture that cannot be back-filled.
        continue-on-error: true
        run: |
          glasshouse init-db
          glasshouse scan-events --news
          glasshouse ingest enforcement --source fed
          glasshouse ingest enforcement --source dockets
          glasshouse dedupe
          glasshouse diff --record
          glasshouse digest
        env:
          GLASSHOUSE_CONTACT: ${{ vars.GLASSHOUSE_CONTACT }}
      # THE IRREPLACEABLE CAPTURE. Votes and enforcement can be re-fetched from
      # SEC/agency archives whenever we like; a POLICY PAGE CANNOT. When a
      # manager quietly edits or deletes a commitment, that version is gone —
      # Wayback's coverage is partial and we have already watched three of these
      # URLs rot away. The versioned promise archive is the one asset no
      # competitor has and no future run can back-fill, so it is captured every
      # day, before anything else can fail.
      - name: Capture policy versions (irreplaceable — run daily)
        run: glasshouse ingest commitments
        env:
          GLASSHOUSE_CONTACT: ${{ vars.GLASSHOUSE_CONTACT }}
      - name: Weekly deep capture — Wayback history for any newly-added source
        if: github.event.schedule == '23 5 * * 0'
        run: glasshouse ingest commitments --wayback --wayback-limit 6 || true
        env:
          GLASSHOUSE_CONTACT: ${{ vars.GLASSHOUSE_CONTACT }}
      - name: Self-diagnosis (emits repair task for the source-medic agent)
        run: glasshouse doctor || true
      - name: Self-improvement loop (auto-applies safe hygiene; ranks the rest)
        run: glasshouse improve --apply-safe || true
        # SAFE tier (dedupe / purge error pages / reconcile review) self-applies
        # every run — the auto-merge tier. Bigger moves (coverage, source repair,
        # code) are written to data/improve/agenda.md for an agent/PR or a human.
        # Data decisions and publication are never auto-actioned here.
      - name: Refresh investigation caches (matrix + agent drafts)
        run: glasshouse investigate refresh || true
        # Rebuilds data/investigate/matrix.json and the agent's drafted leads so
        # the workbench Investigate/Drafts tabs reflect the current ledger. These
        # are OPERATOR artifacts (the matrix is analysis; the drafts are unverified
        # leads) — NOT uploaded to the public artifact below.
      - name: Build PUBLIC artifacts (site = approved findings only; snapshot = publishable rows only)
        run: |
          glasshouse site
          glasshouse export
      # Publishable artifact: the static site and the public snapshot contain
      # only approved findings + non-duplicate primary-source rows. Safe to
      # expose on a public repo.
      - uses: actions/upload-artifact@v4
        with:
          name: public-${{ github.run_number }}
          path: |
            data/_site/
            data/exports/
            data/improve/
          if-no-files-found: ignore
      # Operator-internal outputs (event-alert leads, the doctor/repair brief,
      # the digest draft) are NOT published — they hold unreviewed name-level
      # joins and queue state. On a public repo these stay out of artifacts;
      # the operator reviews them locally or via a private runner.
