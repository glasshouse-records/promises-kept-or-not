name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      # Ledger integrity gate: seed the curated snapshots into a fresh ledger
      # and run the integrity checker (exit 1 on any hard failure).
      - run: |
          glasshouse init-db
          glasshouse seed
          glasshouse integrity
